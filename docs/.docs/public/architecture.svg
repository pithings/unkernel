  <text class="tag blue" x="434" y="240">KERNEL</text>
  <text class="title" x="434" y="264">Linux 7.x</text>
  <rect class="badge green" x="622" y="226" width="98" height="22" rx="11"/>
  <text class="badge-text green" x="671.0" y="241" text-anchor="middle">native wasm</text>
