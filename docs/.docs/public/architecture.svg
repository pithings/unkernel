  <text class="mono" x="580.0" y="292.5" font-size="11" text-anchor="middle">namespaces</text>
  <rect class="pill" x="626" y="278" width="87" height="21" rx="6"/>
  <text class="mono" x="669.5" y="292.5" font-size="11" text-anchor="middle">userfaultfd</text>
