  <text class="title mono" x="736" y="186" font-size="16" text-anchor="end">unkernel.wasm</text>
  <rect class="card" x="64" y="212" width="276" height="182" rx="12" filter="url(#shadow)"/>
  <text class="tag amber" x="86" y="240">USER-MODE CPU</text>
  <text class="title" x="86" y="264">kwemu</text>
  <text class="sub" x="86" y="288">aarch64 CPU written in Zig</text>
  <text class="sub" x="86" y="308">ARMv8.0-A + AES, SHA, CRC32</text>
