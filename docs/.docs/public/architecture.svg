  <title id="title">How unkernel fits together</title>
  <desc id="desc">Unmodified aarch64 Linux programs run on kwemu, an aarch64 CPU linked into the Linux 7.x kernel; both are built into unkernel.wasm, and the kernel runs as native wasm. Programs make syscalls into the kernel (MMU, cgroups, namespaces, ext4, overlayfs, FUSE, 9p, TCP/IP, TUN, vsock, ALSA, evdev, fbdev), which talks through paravirtual devices to the JavaScript SDK: console, terminals, exec, host files, disks, network, fetch, screen, input, sound, vsock, shared memory, snapshots and workers.</desc>
  <style>
    svg { --card: #ffffff; --stroke: #e2e8f0; --text: #0f172a; --muted: #64748b; --pill: #f8fafc; --pillstroke: #e2e8f0; --line: #94a3b8; --mod1: #eef2ff; --mod2: #f5f3ff; --modstroke: #c7d2fe; --green: #16a34a; --amber: #d97706; --blue: #2563eb; --dot: #6366f1; --shadow: 0.07; }
    @media (prefers-color-scheme: dark) { svg { --card: #161b22; --stroke: #30363d; --text: #e6edf3; --muted: #9198a1; --pill: #0d1117; --pillstroke: #30363d; --line: #6e7681; --mod1: #1b1d3f; --mod2: #211a3d; --modstroke: #4338ca; --green: #3fb950; --amber: #f0b429; --blue: #79c0ff; --dot: #a5b4fc; --shadow: 0; } }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: var(--text); }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .tag { font-size: 10.5px; font-weight: 600; letter-spacing: 1.2px; }
    .title { font-size: 17px; font-weight: 600; }
    .sub { font-size: 13px; fill: var(--muted); }
    .small { font-size: 11.5px; fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--stroke); stroke-width: 1; }
    .pill { fill: var(--pill); stroke: var(--pillstroke); stroke-width: 1; }
    .module { fill: url(#module); stroke: var(--modstroke); stroke-width: 1; }
    .wire { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .head { stroke: var(--line); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .shadow { flood-color: #0f172a; flood-opacity: var(--shadow); }
    .mod1 { stop-color: var(--mod1); } .mod2 { stop-color: var(--mod2); }
    .badge { stroke-width: 1; fill-opacity: 0.12; stroke-opacity: 0.45; }
    .badge-text { font-size: 11.5px; font-weight: 600; }
    text.green { fill: var(--green); } rect.green { fill: var(--green); stroke: var(--green); }
    text.amber { fill: var(--amber); } rect.amber { fill: var(--amber); stroke: var(--amber); }
    text.blue { fill: var(--blue); } rect.blue { fill: var(--blue); stroke: var(--blue); }
    .dot { fill: var(--dot); }
    @media (prefers-reduced-motion: reduce) { .dot { display: none; } }
  </style>
  <defs>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow class="shadow" dx="0" dy="1" stdDeviation="2"/>
    </filter>
    <linearGradient id="module" x1="0" y1="0" x2="1" y2="1">
      <stop class="mod1" offset="0"/><stop class="mod2" offset="1"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M1,1 L9,5 L1,9"/>
    </marker>
  </defs>

